services:
  sub2api-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: sub2api
      PGDATA: /var/lib/postgresql/data
    volumes: [sub2api-postgres:/var/lib/postgresql/data]
    networks: [sub2api-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 2s
      timeout: 3s
      retries: 30
  sub2api-redis:
    image: redis:8-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    environment: {REDIS_PASSWORD: "${SUB2API_REDIS_PASSWORD:?required}"}
    volumes: [sub2api-redis:/data]
    networks: [sub2api-data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
  sub2api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${http_proxy:-${HTTP_PROXY:-}}
        HTTPS_PROXY: ${https_proxy:-${HTTPS_PROXY:-}}
        NO_PROXY: ${no_proxy:-${NO_PROXY:-}}
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      RUN_MODE: standard
      DATABASE_HOST: sub2api-postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?required}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: sub2api-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${SUB2API_REDIS_PASSWORD:?required}
      REDIS_DB: "0"
      REDIS_ENABLE_TLS: "false"
      ADMIN_EMAIL: ${SUB2API_ADMIN_EMAIL:?required}
      ADMIN_PASSWORD: ${SUB2API_ADMIN_PASSWORD:?required}
      JWT_SECRET: ${SUB2API_JWT_SECRET:?required}
      TOTP_ENCRYPTION_KEY: ${SUB2API_TOTP_KEY:?required}
      DISTRIBUTION_TRACKING_HASH_SECRETS: ${SUB2API_TRACKING_SECRET:?required}
    depends_on:
      sub2api-postgres: {condition: service_healthy}
      sub2api-redis: {condition: service_healthy}
    ports: ["127.0.0.1:${SUB2API_PORT:-8080}:8080"]
    networks: [sub2api-data, integration-edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes: {sub2api-postgres: {}, sub2api-redis: {}}
networks: {sub2api-data: {internal: true}, integration-edge: {}}
