name: sub2api-dev

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  sub2api-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: sub2api
      PGDATA: /var/lib/postgresql/data
    ports: ["127.0.0.1:${SUB2API_POSTGRES_PORT:-5432}:5432"]
    volumes: [sub2api-postgres:/var/lib/postgresql/data]
    networks: [sub2api-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: *logging
  sub2api-redis:
    image: redis:8-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    environment: {REDIS_PASSWORD: "${SUB2API_REDIS_PASSWORD:?required}"}
    ports: ["127.0.0.1:${SUB2API_REDIS_PORT:-6379}:6379"]
    volumes: [sub2api-redis:/data]
    networks: [sub2api-data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: *logging

volumes: {sub2api-postgres: {}, sub2api-redis: {}}
networks: {sub2api-data: {}}
